name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths: [worker/**, wrangler.toml, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set protected sync token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
        run: echo -n "$DASHBOARD_SYNC_TOKEN" | npx wrangler secret put DASHBOARD_SYNC_TOKEN --name stockbot-domestic-api
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
